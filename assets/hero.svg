<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI Flashcard Maker — Paste your notes, get flashcards to study from">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#1a1e27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#2a3040" stroke-width="2"/>
  <!-- stacked cards -->
  <g transform="rotate(-6 880 315)">
    <rect x="780" y="180" width="280" height="180" rx="16" fill="#232936" stroke="#2a3040" stroke-width="2"/>
    <text x="920" y="275" font-family="system-ui, sans-serif" font-size="22" fill="#9aa3b2" text-anchor="middle">Back: Jane Austen</text>
  </g>
  <g transform="rotate(4 880 315)">
    <rect x="760" y="230" width="300" height="190" rx="16" fill="#f59e0b"/>
    <text x="910" y="315" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">Who wrote</text>
    <text x="910" y="350" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">Pride and Prejudice?</text>
  </g>
  <text x="90" y="210" font-family="system-ui, sans-serif" font-size="76" font-weight="800" fill="#f3f4f6">AI Flashcard Maker</text>
  <text x="90" y="290" font-family="system-ui, sans-serif" font-size="34" fill="#f59e0b">Paste your notes, get flashcards to study from.</text>
  <text x="90" y="345" font-family="system-ui, sans-serif" font-size="28" fill="#9aa3b2">Free — and they work in Anki too.</text>
  <rect x="90" y="400" width="330" height="56" rx="28" fill="#f59e0b"/>
  <text x="255" y="437" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">No account · No server</text>
  <text x="90" y="530" font-family="system-ui, sans-serif" font-size="22" fill="#9aa3b2">mrabr381.github.io/ai-flashcard-maker</text>
</svg>
